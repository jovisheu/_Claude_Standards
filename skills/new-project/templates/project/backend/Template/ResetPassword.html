<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <title>重設密碼</title>
</head>
<body style="font-family: 'Microsoft JhengHei', sans-serif; color: #1f2937; line-height: 1.6;">
  <p>{{DisplayName}} 您好：</p>
  <p>我們收到您在「{{SystemName}}」重設密碼的申請，請於 {{ExpireMinutes}} 分鐘內點選下方連結設定新密碼：</p>
  <p><a href="{{ResetUrl}}" style="display: inline-block; padding: 8px 16px; background: #1e6fd9; color: #ffffff; text-decoration: none; border-radius: 4px;">設定新密碼</a></p>
  <p>若無法點選，請將以下網址複製到瀏覽器開啟：<br>{{ResetUrl}}</p>
  <p>連結只能使用一次；若您未提出申請，請忽略本信，您的密碼不會變更。</p>
  <p style="color: #6b7280; font-size: 12px;">本信由系統自動發送，請勿直接回覆。</p>
</body>
</html>
