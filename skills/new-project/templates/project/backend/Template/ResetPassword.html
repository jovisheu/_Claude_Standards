<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <title>重設密碼通知</title>
</head>
<body style="margin:0;padding:24px;background:#f3f4f6;font-family:'Microsoft JhengHei',Arial,sans-serif;color:#1f2937;">
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:560px;margin:0 auto;background:#ffffff;border-radius:8px;">
    <tr>
      <td style="padding:24px 32px;border-bottom:1px solid #e5e7eb;font-size:18px;font-weight:bold;">{{SystemName}}</td>
    </tr>
    <tr>
      <td style="padding:24px 32px;font-size:15px;line-height:1.7;">
        <p>{{DisplayName}} 您好：</p>
        <p>我們收到您重設密碼的申請，請於 {{ExpireMinutes}} 分鐘內點選下方按鈕設定新密碼。連結僅能使用一次。</p>
        <p style="text-align:center;margin:32px 0;">
          <a href="{{ResetLink}}" style="display:inline-block;padding:12px 28px;background:#1e6fd9;color:#ffffff;text-decoration:none;border-radius:6px;">重設密碼</a>
        </p>
        <p style="font-size:13px;color:#6b7280;">若按鈕無法點選，請複製以下網址至瀏覽器開啟：<br />{{ResetLink}}</p>
        <p style="font-size:13px;color:#6b7280;">若您未申請重設密碼，請忽略本信，您的密碼不會被變更。</p>
      </td>
    </tr>
    <tr>
      <td style="padding:16px 32px;border-top:1px solid #e5e7eb;font-size:12px;color:#9ca3af;">本信件由系統自動發送，請勿直接回覆。</td>
    </tr>
  </table>
</body>
</html>
