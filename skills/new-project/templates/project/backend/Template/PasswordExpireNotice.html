<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <title>密碼即將到期</title>
</head>
<body style="font-family: 'Microsoft JhengHei', sans-serif; color: #1f2937; line-height: 1.6;">
  <p>{{DisplayName}} 您好：</p>
  <p>您在「{{SystemName}}」的帳號 {{Username}} 密碼將於 {{ExpireAt}} 到期（剩餘 {{RemainingDays}} 天），請於到期前登入系統變更密碼。</p>
  <p><a href="{{LoginUrl}}" style="display: inline-block; padding: 8px 16px; background: #1e6fd9; color: #ffffff; text-decoration: none; border-radius: 4px;">前往登入</a></p>
  <p>若無法點選，請將以下網址複製到瀏覽器開啟：<br>{{LoginUrl}}</p>
  <p>密碼到期後須先變更密碼才能登入。到期前每日寄送一次本通知，變更密碼後即不再寄送。</p>
  <p style="color: #6b7280; font-size: 12px;">本信由系統自動發送，請勿直接回覆。</p>
</body>
</html>
